summary: >-
  Manitoba Hydro publishes exactly one /.well-known/ document — a valid RFC 9116
  security.txt on the corporate website. No OIDC discovery, no OAuth
  authorization-server metadata, no RFC 9727 api-catalog, and no ai-plugin.json
  is served on any host. The two ArcGIS hosts that actually carry the open data
  (services2.arcgis.com, dservices2.arcgis.com) are Esri infrastructure, not
  Manitoba Hydro infrastructure, and answer /.well-known/ requests with HTTP 403.
