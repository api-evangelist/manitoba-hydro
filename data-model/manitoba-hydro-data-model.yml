relationships:
- from: PlannedOutage
  to: CustomerServiceCentre
  kind: belongs_to
  via: CSC -> csc_name
  confidence: medium
  evidence: >-
    PlannedOutage.CSC held "CITY CENTER" and CustomerServiceCentre.csc_name
    holds upper-case service centre names such as "KILLARNEY". The value shapes
    match, but the layers live on different hosts (services2.arcgis.com vs
    maps.hydro.mb.ca) with no declared relationship and no shared code field,
    and the join is on a display name rather than csc_code.
- from: StationArea
  to: CustomerServiceCentre
  kind: belongs_to
  via: CSC_NUMBER -> csc_number
  confidence: low
  evidence: >-
    Field names align exactly, but csc_number was null on the CustomerServiceCentre
    records sampled, so the join could not be exercised. Use sap_code /
    SAP_CSC_CODE instead if a hard key is needed.
- from: HydrologicalObservation
  to: GaugingStation
  kind: belongs_to
  via: attributes["1"] (station number) -> stationdata.json station number
  confidence: high
  evidence: >-
    Station number 05UF706 in the Water Level observation file resolves against
    the station metadata file. This is the only join in the whole estate that is
    unambiguous.
- from: HydrologicalObservation
  to: HydrologicalParameter
  kind: belongs_to
  via: file name <pid>.json -> tsdata.json features[].attributes.pid
  confidence: high
  evidence: The url.JSON member of each tsdata entry names the observation file directly.
- from: CurrentOutage
  to: PlannedOutage
  kind: none
  confidence: high
  evidence: >-
    No relationship. OUTAGE_ID and ORDER_ID share a format but the two layers
    are separate publications with different attribute sets, and nothing links a
    completed planned order to a current outage.
- from: CurrentOutage
  to: GaugingStation
  kind: none
  confidence: high
  evidence: >-
    The grid and hydrology estates share no key, no host, and no vocabulary.
    Any correlation must be spatial, and the outage polygons and gauging station
    points are in different coordinate systems (EPSG:26914 vs decimal degrees).

spatial_join:
  note: >-
    The only general-purpose way to relate these entities is geometry. All
    ArcGIS layers support spatial queries (geometry, geometryType, spatialRel,
    inSR, outSR); pass outSR=4326 to bring everything into WGS84 before
    intersecting with the hydrological station coordinates.

gaps:
- No customer, account, premise, meter, or consumption entity exists — Manitoba
  Hydro has no advanced metering infrastructure and no consumer data API, so
  there is nothing on the demand side of the model at all.
- No asset entity. DEVICE on PlannedOutage names transformer banks by id but no
  asset registry is published to resolve them against.
- No generation, transmission, interchange, or wholesale market entity. Manitoba
  Hydro trades into MISO but publishes none of that data itself.

