method: derived
source: >-
  live ArcGIS layer metadata and query responses captured 2026-07-27
  (examples/), the WFS DescribeFeatureType schemas (wfs/), and the KISTERS
  hydrological JSON tree; modelled formally in json-schema/
summary: >-
  Manitoba Hydro publishes four disconnected data islands, not one data model.
  Nothing declares a relationship to anything else — there are no ArcGIS
  relationshipClasses on any service, no foreign-key declarations, and no
  documentation. The joins below are inferred from matching attribute values and
  are stated with an explicit confidence, because Manitoba Hydro has never
  asserted them.

