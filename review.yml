findings:
  summary: >-
    Manitoba Hydro is the control case for the whole energy sector question. It
    proves that a mandate is not an implementation by removing the mandate
    entirely and watching what a utility does anyway. What it does is publish no
    consumer data API of any kind — not gated, not applied-for, simply absent,
    because Manitoba never legislated a consumer energy data right and Manitoba
    Hydro never deployed the smart meters that would generate the data — while
    simultaneously running the most anonymously accessible operational data
    surface of any Canadian utility reviewed. Current and planned outages,
    station locations, service centre boundaries and vegetation work are all
    queryable with no key over ArcGIS REST and OGC WFS 2.0.0, refreshed every
    five minutes; a hydrological monitoring application serves same-day water
    level readings for 158 gauging stations as plain JSON. None of it is called
    an API. None of it is documented, licensed, versioned, or supported. It
    exists because a GIS team shared its layers publicly and a hydrology team
    put a KISTERS viewer on the web, not because anyone decided to run a
    developer programme. The finding is that in an unmandated market the open
    data appears anyway — just on the grid side, never on the customer side, and
    always as a by-product rather than a product.
  posture: unmandated-closed-consumer-data-open-undocumented-grid-data
  gated: false
  openapiHarvested: false
  developerPortal: none
