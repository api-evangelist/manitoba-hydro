  kind: service-metadata
  request: GET https://services2.arcgis.com/QoeQkfdOG126FqSi/arcgis/rest/services/Manitoba_Hydro_Current_Power_Outages/FeatureServer/0?f=json
  status: 200
  describes: >-
    Layer 0 "MH Current Power Outages". Carries the full field list (15
