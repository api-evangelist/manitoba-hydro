generated: '2026-07-27'
method: searched
source: >-
  live anonymous requests against Manitoba Hydro's published surfaces on
  2026-07-27; every file in this directory is a verbatim response body, not a
  constructed sample
note: >-
  Manitoba Hydro publishes no API documentation and therefore no examples. These
  captures exist so a consumer can see the real shape of each surface — the
  self-describing service metadata, a real query response, and a real error —
  without having to discover the endpoints first. Values are a point-in-time
  snapshot and will not match a live call.

