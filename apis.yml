apis:
- aid: manitoba-hydro:manitoba-hydro-current-power-outages
  name: Manitoba Hydro Current Power Outages
  description: >-
    A hosted Esri feature service published by Manitoba Hydro's ArcGIS Online
    organization (org id QoeQkfdOG126FqSi, org name "Manitoba Hydro", item owner
    dcarpenter@hydro.mb.ca) carrying live unplanned power outage polygons. The
    item is shared publicly and was queried anonymously with no key, token, or
    registration — an anonymous returnCountOnly query returned 8 active outages
    at review time. Layer 0 "MH Current Power Outages" exposes OUTAGE_ID,
    OUTAGE_TYPE, TIME_OF_OUTAGE, NUM_CUST_NOPOWER, NUM_CUST_NOPOWERTXT, ETR,
    CAUSE, SUBCAUSE, CREW_STATUS, FIELD_VERIFIED_ETR, DATA_LAST_UPDATE and AREA.
    Service capabilities are Query only. The same data is also published as an
    OGC WFS 2.0.0 endpoint whose GetCapabilities document was retrieved
    anonymously. Manitoba Hydro publishes no documentation, no terms of use, and
    no rate limits for this surface — it is a public map layer that behaves as
    an API.
