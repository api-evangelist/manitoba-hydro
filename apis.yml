- aid: manitoba-hydro:manitoba-hydro-planned-power-outages
  name: Manitoba Hydro Planned Power Outages
  description: >-
    A hosted Esri feature service published by the same Manitoba Hydro ArcGIS
    Online organization carrying planned outage areas. The item description
    states the layer "contains planned power outages and the area that will be
    impacted. Attributes include the scheduled start and end date/time for each
    outage. This data is updated every 5 minutes." Queried anonymously with no
    credentials, an unfiltered count returned 48 planned outages at review time.
    Layer 0 "MH Planned Power Outages" exposes ORDER_ID, ORDER_LAST_UPDATED,
    ORDER_STATUS_DESCRIPTION, ORDER_CAUSE, ORDER_TYPE, ORDER_DESCRIPTION,
    DEVICE, DEVICE_ADDRESS, CSC, SCHEDULED_START_TIME, SCHEDULED_END_TIME,
    DATA_LAST_UPDATE and NUM_CUST_NOPOWERTXT. A parallel OGC WFS 2.0.0 endpoint
    is published for the same layer. No licence or terms of use is attached to
    the item.
