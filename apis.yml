- aid: manitoba-hydro:manitoba-hydro-hydrological-data
  name: Manitoba Hydro Hydrological Data
  description: >-
    Manitoba Hydro's near-real-time hydrological monitoring application, a
    KISTERS WISKI Web Public deployment documented on hydro.mb.ca and reachable
    at https://www.hydro.mb.ca/hydrologicalData/static/. The application is
    documented for humans; its data files are not documented at all, but they
    are served anonymously as JSON and were verified live — station metadata
    (169 gauging stations with river, catchment, latitude, elevation and station
    number fields), a layer index of 15 monitored parameters (Water Level, Water
    Temperature, Air Temperature, Precipitation, Snow Depth, wind speed,
    direction, gust and peak variants, Relative Humidity, Atmospheric Pressure),
    and per-parameter observation files. The Water Level file returned 158
    stations with readings timestamped the same day as this review. Manitoba
    Hydro's own page states the readings come from gauging stations managed by
    Manitoba Hydro, the Water Survey of Canada and Manitoba Water Stewardship,
    that data are "preliminary and are being transmitted automatically without
    verification or review for quality assurance," and that Manitoba Hydro "does
    not warrant the quality, accuracy, or completeness of any information."
    There is no API documentation, no versioning, and no stated licence. Note
    that an older parallel tree at /hydrologicalData/data/ is still served but
    is frozen at February 2021 readings; only the /static/ tree is current.
  humanURL: https://www.hydro.mb.ca/corporate/operations/water-levels/hydrological-data/
  baseURL: https://www.hydro.mb.ca/hydrologicalData/static/data/
