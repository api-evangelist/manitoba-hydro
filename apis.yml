- aid: manitoba-hydro:manitoba-hydro-arcgis-server-reference-data
  name: Manitoba Hydro ArcGIS Server Reference Data
  description: >-
    An ArcGIS Server 10.91 REST services directory hosted on Manitoba Hydro's
    own domain at maps.hydro.mb.ca, readable anonymously. The root listing
    returned nine folders (ARL, ConTrack, DISTAPPS, GDS, JUTA, LEA, Locators,
    ReferenceData, Utilities); most are empty to an anonymous caller, but
    ReferenceData/MH_AdminBoundaries is fully readable and exposes three
    query-capable layers — MH_CustomerServiceCentres (19 features),
    MH_LocateAreas and MH_StationAreas. The site root itself returns HTTP 403;
    only the /arcgis/rest/services tree responds. Manitoba Hydro publishes no
    documentation, index, or terms for this host — it is recorded here because
    it is a real, on-domain, anonymously queryable API surface, not because it
    is offered as one.
  humanURL: https://maps.hydro.mb.ca/arcgis/rest/services?f=json
  baseURL: https://maps.hydro.mb.ca/arcgis/rest/services
